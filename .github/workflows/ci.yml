# Started by hand only, like the organisation's other repositories: no push or schedule triggers. The fast checks
# always run; the browser suites run by default and the performance suites when asked, each in a job of its own, so
# they run side by side on runners of their own instead of competing for one runner's cores. The performance budgets
# are timings, which a shared runner measures more than it measures the app, so they are left to a run that asks for
# them (before a release, or after a change to the stream, the store or the replay path).
name: ci

on:
  workflow_dispatch:
    inputs:
      browser:
        description: The browser tests over the event tree (smoke, accessibility, visual)
        type: boolean
        default: true
      browser-api:
        description: The browser tests again, every document read from PostgreSQL through the query API
        type: boolean
        default: true
      performance:
        description: The performance budgets, over the tree and over the query API
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the dashboard
        uses: actions/checkout@v4
        with:
          path: dashboard

      - name: Read the locked specification commit
        id: lock
        run: echo "commit=$(node -p "require('./dashboard/packages/contract/vendor/cwa.lock.json').spec_commit")" >> "$GITHUB_OUTPUT"

      # The vendor check compares the copy with the specification at the locked commit.
      - name: Check out the specification at the locked commit
        uses: actions/checkout@v4
        with:
          repository: contextwindowarchitecture/contextwindowarchitecture
          ref: ${{ steps.lock.outputs.commit }}
          path: contextwindowarchitecture

      - uses: ./dashboard/.github/actions/setup-dashboard

      - name: Vendor check
        working-directory: dashboard
        run: pnpm vendor:check ../contextwindowarchitecture

      - name: Generated files are current
        working-directory: dashboard
        run: pnpm generate --check

      - name: Format
        working-directory: dashboard
        run: pnpm format:check

      - name: Lint
        working-directory: dashboard
        run: pnpm lint

      - name: Typecheck
        working-directory: dashboard
        run: pnpm typecheck

      - name: Test
        working-directory: dashboard
        env:
          CWA_SPEC_CHECKOUT: ${{ github.workspace }}/contextwindowarchitecture
        run: pnpm test

      - name: Build
        working-directory: dashboard
        run: pnpm build

      - name: Bundle budgets
        working-directory: dashboard
        run: pnpm --filter web budgets

      # The manifests render: the production overlay, the one with PostgreSQL and the one with sign-in, as `oc apply -k` would build them.
      - name: Render the deployment
        working-directory: dashboard
        run: |
          kubectl kustomize deploy/overlays/prod > /dev/null
          kubectl kustomize deploy/overlays/prod-postgres > /dev/null
          kubectl kustomize deploy/overlays/prod-sign-in > /dev/null

  browser:
    if: inputs.browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dashboard
      - uses: ./dashboard/.github/actions/setup-dashboard
        with:
          browser: "true"
      - name: Browser tests
        working-directory: dashboard
        run: pnpm --filter web test:e2e

  browser-api:
    if: inputs.browser-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dashboard
      - uses: ./dashboard/.github/actions/setup-dashboard
        with:
          browser: "true"
      - name: Browser tests over the query API
        working-directory: dashboard
        run: pnpm --filter web test:e2e:api

  performance:
    if: inputs.performance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [test:perf, test:perf:api]
    name: performance (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4
        with:
          path: dashboard
      - uses: ./dashboard/.github/actions/setup-dashboard
        with:
          browser: "true"
      - name: Performance tests
        working-directory: dashboard
        run: pnpm --filter web ${{ matrix.suite }}
