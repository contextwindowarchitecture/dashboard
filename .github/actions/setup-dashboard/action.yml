# The setup every CI job shares: pnpm at the version package.json pins, Node 24 with pnpm's store cached, the
# workspace installed from its lockfile (its postinstall builds the pinned assembler, ADR-0003), and, for the browser
# and performance jobs, Playwright's Chromium. The dashboard is checked out at `dashboard/` beside the specification.
name: Set up the dashboard
description: Installs pnpm, Node and the workspace, and Playwright's browser when asked
inputs:
  browser:
    description: Install Playwright's Chromium with its system dependencies
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: dashboard/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: dashboard/pnpm-lock.yaml
    - name: Install
      shell: bash
      working-directory: dashboard
      run: pnpm install --frozen-lockfile
    - name: Install Playwright's browser
      if: inputs.browser == 'true'
      shell: bash
      working-directory: dashboard/apps/web
      run: pnpm exec playwright install --with-deps chromium
