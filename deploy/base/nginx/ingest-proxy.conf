# The ingest service (apps/ingest) at /api/: POST /api/replay for the sandbox and POST /api/events for a wrapper, on
# the app's own origin, so the policy's connect-src stays 'self'. Added beside dashboard.conf where the service runs
# (deploy/base/kustomization.yaml, docker-compose.yml); the image alone has no service and leaves it out.
# The ingest service (apps/ingest): POST /api/replay for the sandbox and POST /api/events for a wrapper. Bodies as
# large as the service takes (MAX_BODY_BYTES, 4 MiB); a replay has its own timeout, so the proxy waits longer.
location /api/ {
    proxy_pass http://dashboard-ingest:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 4m;
    # The service sends Cache-Control: no-store itself.
    include /opt/app-root/etc/nginx.default.d/headers.inc;
}
