# The dashboard's server (dashboard-plan.md 11), included in the default server of the UBI nginx image, whose root is
# /opt/app-root/src, the built app. The event tree is a volume at /srv/data, served as /data/. The ingest service is
# proxied at /api/ by ingest-proxy.conf, which the cluster and compose add beside this file (the image includes every
# *.conf in /opt/app-root/etc/nginx.default.d) and the image leaves out, since nginx will not start naming a host it
# cannot resolve. The cluster mounts these files from a ConfigMap over that directory; the image carries this file
# and headers.inc, so `podman run` works on its own, with no sandbox.

include /opt/app-root/etc/nginx.default.d/headers.inc;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain image/svg+xml;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# The app. index.html and config.json are never cached, so a rollout shows at once; hashed assets are immutable.
location = /index.html {
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "no-cache" always;
}
location = /config.json {
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "no-cache" always;
}
location /assets/ {
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location / {
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}

# The event tree. An event never changes once written, so it is cached for good (on success only: a missing event's
# 404 must not be). The index, the closed windows (an old event can still join its day), the sessions (a turn can
# arrive) and the fleet report change as events arrive, and are never cached. No listing, JSON only.
location /data/ {
    root /srv;
    autoindex off;
    types {
        application/json json;
    }
    default_type application/octet-stream;
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "no-cache" always;
}
# Quoted: nginx reads a brace in an unquoted pattern as the start of the block.
location ~ "^/data/events/[0-9A-HJKMNP-TV-Z]{26}\.json$" {
    root /srv;
    default_type application/json;
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location = /data/events/index.json {
    root /srv;
    default_type application/json;
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "no-cache" always;
}
location /data/events/index/ {
    root /srv;
    autoindex off;
    default_type application/json;
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "no-cache" always;
}
location /data/sessions/ {
    root /srv;
    autoindex off;
    default_type application/json;
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "no-cache" always;
}
location = /data/fleet.json {
    root /srv;
    default_type application/json;
    include /opt/app-root/etc/nginx.default.d/headers.inc;
    add_header Cache-Control "no-cache" always;
}
