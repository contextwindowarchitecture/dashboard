# Dex (ADR-0010) at /dex/, on the dashboard's own host, so sign-in needs no second host or certificate. Added beside
# dashboard.conf where Dex runs (deploy/components/sign-in, docker-compose.signin.yml). The ingest service reaches Dex
# directly (OIDC_ISSUER_INTERNAL); this is the browser's way in.
location /dex/ {
    proxy_pass http://dashboard-dex:5556/dex/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /opt/app-root/etc/nginx.default.d/headers.inc;
}
