# Every pull request: each file where the layout puts it, no published version edited or removed, and
# each changed route shadowed over its corpus in shadow.json on the dashboard, within its limits.
name: policy check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: contextwindowarchitecture/dashboard/.github/actions/policy-check@69c8e2141d50e2ffce1e2302ac67424ad9a9a28d
        with:
          base: ${{ github.event.pull_request.base.sha }}
          report-dir: ${{ runner.temp }}/shadow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-reports
          path: ${{ runner.temp }}/shadow
          if-no-files-found: ignore
