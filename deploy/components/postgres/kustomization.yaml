# Events in PostgreSQL instead of the tree (ADR-0007): the database, the ingest service's DATABASE_URL, and a
# config.json that reads every document from the query API at /api/data. Apply it through an overlay that includes
# it (deploy/overlays/prod-postgres); without it the deployment keeps the tree.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - postgres.yaml

configMapGenerator:
  - name: dashboard-config
    behavior: replace
    files:
      - config.json

patches:
  # The store: DATABASE_URL from the secret's parts, which must be URL-safe (deploy/README.md generates hex).
  - target:
      kind: Deployment
      name: dashboard-ingest
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PGUSER
          valueFrom: { secretKeyRef: { name: dashboard-postgres, key: user } }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PGPASSWORD
          valueFrom: { secretKeyRef: { name: dashboard-postgres, key: password } }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PGDATABASE
          valueFrom: { secretKeyRef: { name: dashboard-postgres, key: database } }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DATABASE_URL
          value: postgres://$(PGUSER):$(PGPASSWORD)@dashboard-postgres:5432/$(PGDATABASE)
