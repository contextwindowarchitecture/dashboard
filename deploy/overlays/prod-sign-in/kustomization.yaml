# dashboard.contextwindowarchitecture.io with sign-in (ADR-0010): the PostgreSQL overlay plus the sign-in component,
# Dex at https://dashboard.contextwindowarchitecture.io/dex signing in members of the contextwindowarchitecture
# GitHub organisation. Apply it once the secrets exist (deploy/README.md, Sign-in); applying prod-postgres again
# takes sign-in away. access.json is who may read what (ADR-0011, ADR-0012): the default tenant stays open to
# anonymous readers, bodies and all, as D11 and P3-D5 have it; the demo's second tenant, northwind, is its signed-in
# members' alone, who are also auditors; teams are added under "groups".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cwa-dashboard

resources:
  - ../prod-postgres

components:
  - ../../components/sign-in
  - ../../components/publish

configMapGenerator:
  - name: dashboard-access
    files:
      - access.json
  - name: dashboard-sign-in
    literals:
      - issuer=https://dashboard.contextwindowarchitecture.io/dex
      - redirect-uri=https://dashboard.contextwindowarchitecture.io/api/auth/callback
      - github-org=contextwindowarchitecture
  # Publish (ADR-0014): the default tenant's drafts go to the demo's policy repository; northwind has none, so its
  # owners are given the file and the commands.
  - name: dashboard-publish
    literals:
      - 'repositories={"default": "contextwindowarchitecture/policies-demo"}'
