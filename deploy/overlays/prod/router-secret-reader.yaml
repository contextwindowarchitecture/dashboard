# The router reads the certificate from its secret itself (the Route's externalCertificate), so its service account
# may read that one secret in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-tls-reader
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [dashboard-tls]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-tls-reader
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
roleRef:
  kind: Role
  name: dashboard-tls-reader
  apiGroup: rbac.authorization.k8s.io
