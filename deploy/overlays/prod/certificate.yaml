# The host's certificate, issued and renewed by cert-manager into the secret the Route names.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dashboard-tls
spec:
  secretName: dashboard-tls
  dnsNames:
    - dashboard.contextwindowarchitecture.io
  issuerRef:
    name: letsencrypt
    kind: Issuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
